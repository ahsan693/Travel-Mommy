<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Destinations Widget</title>
    <style>
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: auto;
        overflow: hidden; /* prevents scrollbar on html, allows scrollHeight measurement */
      }
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: auto;
        background: transparent;
        font-family: Arial, sans-serif;
        overflow: visible; /* allows content to expand beyond initial viewport */
      }
      #tpwl-search,
      #tpwl-tickets {
        width: 100%;
      }
      #tpwl-tickets {
        margin-top: 16px;
      }
    </style>
  </head>
  <body>
    <div id="tpwl-search"></div>
    <div id="tpwl-tickets"></div>

    <script>
      function reportHeight() {
        // Use documentElement.scrollHeight — captures full content when body is overflow:visible
        var h = Math.max(
          document.body.scrollHeight,
          document.body.offsetHeight,
          document.documentElement.scrollHeight,
          document.documentElement.offsetHeight
        );
        if (h > 0) {
          window.parent.postMessage({ type: 'destinations-widget-height', height: h + 8 }, '*');
        }
      }

      var resizeTimer;
      function debouncedReportHeight() {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(reportHeight, 150);
      }

      window.addEventListener('DOMContentLoaded', function () {
        const script = document.createElement('script');
        script.async = true;
        script.charset = 'utf-8';
        script.src = 'https://tpemb.com/content?currency=eur&trs=550056&shmarker=750683&locale=en&powered_by=true&from_name=london_gb&stops=0&limit=4&primary_color=FFD43B&results_background_color=FFFFFF&form_background_color=FFFFFF&promo_id=4563&campaign_id=111';
        script.onload = function () {
          reportHeight();
          setTimeout(reportHeight, 500);
          setTimeout(reportHeight, 1500);
          setTimeout(reportHeight, 3000);
          setTimeout(reportHeight, 5000);
        };
        document.body.appendChild(script);
      });

      // catch any DOM mutations (widget injecting cards or transitioning views)
      var observer = new MutationObserver(function() {
        debouncedReportHeight();
        // extra delayed checks to catch post-animation height
        setTimeout(reportHeight, 300);
        setTimeout(reportHeight, 800);
      });
      observer.observe(document.body, { childList: true, subtree: true, attributes: true });

      window.addEventListener('resize', debouncedReportHeight);
    </script>
  </body>
</html>
